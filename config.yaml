# Shared experiment configuration for the Trinity optimizer comparison study.
# All training scripts (train_resnet18_dsaa.py, train_transformer_dsaa.py,
# train_wide_resnet_dsaa.py) read hyperparameters from this file instead of
# hardcoding them, so every architecture is compared under identical settings.

wandb:
  # Base project name. Each training script appends "-{model}" (e.g.
  # "trinity-optimizer-comparison-resnet18") so that one wandb project holds every
  # optimizer's run for a given model+dataset, all directly comparable in one place.
  project: wideresnet-trinity-optimizer-comparison-200

dataset:
  name: cifar10          # cifar10 | cifar100 (Long-Tailed variant, IF = imb_factor)
  imb_factor: 0.01        # 0.01 -> imbalance factor 100 (img_max * 0.01^(...))
  batch_size: 128
  num_workers: 2

training:
  epochs: 200
  grad_clip_norm: 1.0
  seed: 42
  lr_schedule: cosine     # CosineAnnealingLR over `epochs`
  warmup_epochs: 5        # 5 epochs linear warmup for transformer and representation stability

optimizers:
  adam:
    lr: 0.001
    betas: [0.9, 0.999]
    eps: 1.0e-8
    weight_decay: 1.0e-4

  rmsprop:
    lr: 0.001
    alpha: 0.99
    eps: 1.0e-8
    momentum: 0.0
    weight_decay: 1.0e-4

  sgd:
    lr: 0.1
    momentum: 0.9
    nesterov: true
    weight_decay: 5.0e-4

  trinity:
    lr: 0.001
    betas: [0.9, 0.999]
    eps: 1.0e-8
    weight_decay: 1.0e-4
    # Reverted to 0.01 (was temporarily 0.5, matching only the transformer's tuned
    # value -- ambiguous since this shared block also applies to ResNet-18/WideResNet,
    # which had never been tested at 0.5 and were working fine at 0.01, per logs/
    # trinity.log and logs/trinity_wresnet.log). Every architecture now gets its own
    # explicit override below (resnet18/wide_resnet/transformer/transformer_small),
    # so this shared value is only a fallback for an architecture with no override.
    damping: 0.01
    kfac_stat_interval: 10
    kfac_inv_interval: 100
    kfac_decay: 0.95
    # d_max. Measured SO-eligible share of trackable params at each setting:
    #   2400 -> ResNet-18 36.6% | WRN-101-2 33.8% | ViT 11.2%
    #   4800 -> ResNet-18  100% | WRN-101-2 77.3% | ViT  100%
    # At 2400 the ViT's 768<->3072 MLP layers and ResNet-18 layer4 convs are excluded.
    # Setting max_kfac_dim to 4800 enables 100% of ResNet-18 and 100% of ViT layers.
    max_kfac_dim: 4800
    sensor_interval: 100
    sensor_probes: 4
    sensor_nblocks: 2
    sensor_eps: 0.01
    ema_alpha: 0.7
    rho_lo: 0.15
    rho_hi: 0.35
    dwell_time: 500
    beta_max: 0.3
    grad_ema_alpha: 0.99      # EMA coeff for the gbar gradient-norm reference (escape)
    escape_nu_thr: 0.75
    escape_gamma_g: 0.3
    escape_r: 0.001
    escape_lock: 200
    use_gc: true
    use_so: true
    use_zo: true
    use_escape: true
    use_grafting: true
    force_so_always: false

    # Per-architecture overrides, applied on top of the block above.
    #
    # transformer: diagnosed 2026-09-09. Root cause of Trinity badly underperforming
    # Adam on CIFAR100MTransformer (74 blocks, embed_dim=768):
    #   1. use_gc hurts this architecture. Controlled A/B (K-FAC forced on, otherwise
    #      identical): 62.7% train acc with GC off vs 51.8% with GC on at 15 epochs.
    #      GC (Yong et al. 2020) was validated on CNNs; there is no evidence it helps
    #      Linear Q/K/V/out_proj/MLP weights here, and repeated measurement shows it
    #      costs 4-10 points of train accuracy every time it's on.
    #   2. K-FAC never engages in time. sensor_nblocks=2 / sensor_interval=100 was
    #      tuned for ResNet-18 (~18-20 blocks); the transformer has 74. At the shared
    #      defaults, rho_ema (ema_alpha=0.7) never converges below rho_lo=0.15 within
    #      100 epochs -> logs show "SO: 0/74" for the ENTIRE run, i.e. Trinity runs as
    #      plain (GC-crippled) AdamW the whole time. Raising sensor_nblocks, lowering
    #      sensor_interval, and lowering ema_alpha (fewer real samples needed per
    #      block to trust them) lets SO blocks actually turn on partway through
    #      training. Validated: with these overrides, 30-epoch run reaches SO:22/74
    #      with 22/22 successful K-FAC inversions and 61%+ train acc, vs. the shared
    #      defaults still stuck at SO:0/74 and ~48-51% train acc at the same point.
    #   Sensor overhead rises with sensor_nblocks (roughly proportional), so this
    #   trades some throughput for K-FAC actually being reachable at all.
    #   3. Once SO blocks engage, they stall training. In the real 200-epoch run with
    #      overrides 1-2 only, loss went flat at ~1.13-1.18 from epoch 13 to 71 (Adam
    #      kept improving over the same stretch) right as rho on those 22 blocks
    #      collapsed toward 0 -- i.e. K-FAC's correction became very sharp/aggressive
    #      and stopped helping. Controlled 45-epoch A/B (damping=0.5 vs damping=0.01
    #      vs beta_max=0.1, all else equal): damping=0.5 wins clearly and
    #      consistently (loss 1.042 vs 1.131 vs 1.176, acc 64.0% vs 59.9% vs 58.5% at
    #      epoch 45), and its grafting_scale sits at ~0.97-1.00 (vs ~0.85-0.89 at
    #      damping=0.01), meaning K-FAC's own step is already close in magnitude to
    #      shadow-AdamW's -- i.e. higher damping pulls K-FAC's direction back toward
    #      the safe, Adam-like one instead of the sharp one that was stalling
    #      training. Reducing beta_max (fewer SO blocks) instead did NOT help -- it
    #      was the worst of the three -- so the fix is "make K-FAC gentler," not "use
    #      it on fewer blocks." Caveat: this A/B used a 45-epoch cosine schedule, not
    #      the real run's 200-epoch one, so it didn't reproduce the exact stall (all
    #      three kept improving); it's a controlled comparison of the two knobs, not
    #      a full repro -- confirm the real 200-epoch stall clears with this value.
    overrides:
      # resnet18 / wide_resnet: baselines (logs/trinity.log, logs/trinity_wresnet.log)
      # had Trinity narrowly beating Adam/RMSprop but losing to SGD on both (ResNet-18:
      # 59.97% vs SGD's 60.86%; WideResNet: 60.95% vs SGD's 65.02%, a much bigger gap).
      # Block-count check: ResNet-18 has 21 Trinity blocks (close to what the shared
      # sensor defaults were hand-tuned for), but WideResNet-101-2 has 105 -- a 5x
      # mismatch, the same shape of problem the transformer had. So the WideResNet sweep
      # also searched sensor_nblocks/sensor_interval/ema_alpha; the ResNet-18 sweep left
      # them at the shared defaults.
      #
      # Both come from an 8-GPU Optuna sweep (tune_trinity_cnn.py, 30-epoch budget, val
      # accuracy as the objective; see tune_resnet18_worker_*.db / tune_wide_resnet_worker_*.db).
      # IMPORTANT CAVEAT, unlike the transformer sweeps: K-FAC (SO) never turned on in
      # ANY of the 39 ResNet-18 trials (n_so=0/21 in every trial, including the best
      # one), and the single best WideResNet trial also had n_so=0/105 -- at only 30
      # epochs, with these architectures' slower-converging rho_ema, K-FAC didn't get
      # enough time to engage. So these sweeps mostly tuned lr/weight_decay for the
      # AdamW+GC-dominated regime, not the actual K-FAC behavior -- the damping/beta_max/
      # rho_lo/rho_hi values below are correspondingly less trustworthy than the lr/
      # weight_decay ones. A full 200-epoch run is needed to know whether this actually
      # beats SGD, not just this 30-epoch proxy.
      resnet18:
        lr: 0.001417
        weight_decay: 0.000947
        damping: 0.0994
        beta_max: 0.333
        rho_lo: 0.1248
        rho_hi: 0.3405

      wide_resnet:
        lr: 0.000817
        weight_decay: 0.000043
        damping: 0.0163
        beta_max: 0.393
        rho_lo: 0.0981
        rho_hi: 0.2078
        sensor_nblocks: 7
        sensor_interval: 52
        ema_alpha: 0.581

      transformer:
        use_gc: false
        sensor_nblocks: 8
        sensor_interval: 50
        ema_alpha: 0.3
        damping: 0.5

      # transformer_small: train_transformer_small_dsaa.py, depth=6/embed_dim=384
      # instead of depth=12/embed_dim=768 -> 38 Trinity blocks instead of 74 (patch_embed
      # + 6*(q,k,v,out,linear1,linear2) + head), roughly halfway between ResNet-18's
      # ~18-20 blocks and the large transformer's 74.
      #
      # use_gc/sensor_nblocks/sensor_interval/ema_alpha are hand-tuned starting points
      # scaled down from the large-transformer findings (use_gc off carries over since
      # root cause 1 was about Linear/attention layer TYPE, not block count; sensor
      # settings are a milder boost since there are ~half as many blocks to cover).
      #
      # lr/weight_decay/damping/beta_max/rho_lo/rho_hi below are NOT hand-tuned -- they
      # come from an 8-GPU x 5-trial Optuna sweep (tune_trinity_transformer_small.py,
      # 25-epoch budget, val accuracy as the objective) over exactly these 6 knobs. That
      # sweep's single clearest finding: lr dominates everything else. Every top-8 trial
      # (out of 34 complete) had lr in [3.5e-4, 4.3e-4]; every bottom trial had
      # lr > 1.2e-3. Trinity had simply been inheriting Adam's lr=0.001 unchanged, and it
      # was never actually tuned for Trinity's own update dynamics (shadow-AdamW step +
      # grafted K-FAC step compound differently from plain AdamW). Best trial: 43.98%
      # val acc at epoch 25 (vs the untuned config's ~26-31% val acc around the same
      # epoch in trinity_transformer_new.log) with the damping/beta_max/rho values below
      # -- notably a LOWER damping than the 0.3-0.5 used above, suggesting the earlier
      # "raise damping" fix was partly just compensating for lr being too high; once lr
      # itself is fixed, K-FAC can run with a lighter touch. Caveat: this ranks trials on
      # a 25-epoch proxy, not the real 200-epoch run -- confirm the ranking holds at
      # full length before trusting it for the paper's numbers.
      transformer_small:
        use_gc: false
        sensor_nblocks: 4
        sensor_interval: 75
        ema_alpha: 0.4
        lr: 0.000375
        weight_decay: 0.000225
        damping: 0.175
        beta_max: 0.232
        rho_lo: 0.185
        rho_hi: 0.272
