dataset:
  batch_size: 128
  imb_factor: 0.01
  name: cifar10
  num_workers: 2
optimizers:
  adam:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    lr: 0.001
    weight_decay: 0.0001
  rmsprop:
    alpha: 0.99
    eps: 1.0e-08
    lr: 0.001
    momentum: 0.0
    weight_decay: 0.0001
  sgd:
    lr: 0.1
    momentum: 0.9
    nesterov: true
    weight_decay: 0.0005
  trinity:
    beta_max: 0.3
    betas:
    - 0.9
    - 0.999
    damping: 0.01
    dwell_time: 500
    ema_alpha: 0.7
    eps: 1.0e-08
    escape_gamma_g: 0.3
    escape_lock: 200
    escape_nu_thr: 0.75
    escape_r: 0.001
    force_so_always: true
    grad_ema_alpha: 0.99
    kfac_decay: 0.95
    kfac_inv_interval: 100
    kfac_stat_interval: 10
    lr: 0.001
    max_kfac_dim: 4800
    rho_hi: 0.35
    rho_lo: 0.15
    sensor_eps: 0.01
    sensor_interval: 100
    sensor_nblocks: 2
    sensor_probes: 4
    use_escape: false
    use_gc: true
    use_grafting: true
    use_so: true
    use_zo: false
    weight_decay: 0.0001
training:
  epochs: 200
  grad_clip_norm: 1.0
  lr_schedule: cosine
  seed: 42
  warmup_epochs: 5
wandb:
  project: ablation
